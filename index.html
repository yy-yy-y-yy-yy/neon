<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Qix Land Infinite - 領土拡大パズル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #080c14;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    padding: 8px 10px env(safe-area-inset-bottom);
    touch-action: none;
    overflow: hidden;
  }
  header {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #111827;
    border-radius: 12px;
    border: 1px solid #1f2937;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .stat-col { display: flex; flex-direction: column; align-items: center; }
  .stat-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
  .stat-val { font-size: 16px; font-weight: 800; color: #38bdf8; }
  .stat-sub { font-size: 10px; color: #fbbf24; font-weight: bold; }

  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 440px;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 6px 0;
  }
  #canvas-container {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 68vh;
    background: #030712;
    border: 2px solid #334155;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(8, 12, 20, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    backdrop-filter: blur(5px);
  }
  #overlay h2 { font-size: 24px; color: #38bdf8; margin-bottom: 8px; font-weight: 900; }
  #overlay p { font-size: 13px; color: #cbd5e1; margin-bottom: 18px; line-height: 1.6; }
  .btn {
    background: linear-gradient(135deg, #0284c7, #2563eb);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    padding: 12px 32px;
    border: none;
    border-radius: 28px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(14, 165, 233, 0.4);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }

  #controls {
    display: grid;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(2, 46px);
    gap: 6px;
    margin-bottom: 4px;
  }
  .d-btn {
    background: #1f2937;
    border: 2px solid #374151;
    border-radius: 12px;
    color: #f3f4f6;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    touch-action: manipulation;
  }
  .d-btn:active, .d-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; transform: translateY(2px); }
  #d-up { grid-column: 2; grid-row: 1; }
  #d-left { grid-column: 1; grid-row: 2; }
  #d-down { grid-column: 2; grid-row: 2; }
  #d-right { grid-column: 3; grid-row: 2; }

  .msg-banner {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid #38bdf8;
    color: #facc15;
    font-size: 12px;
    font-weight: bold;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
    z-index: 10;
  }
</style>
</head>
<body>

<header>
  <div class="stat-col">
    <span class="stat-label">ステージ</span>
    <span class="stat-val" id="stage-disp">STAGE 1</span>
  </div>
  <div class="stat-col">
    <span class="stat-label">領土 (目標 <span id="target-disp">75%</span>)</span>
    <span class="stat-val" id="area-disp">0%</span>
  </div>
  <div class="stat-col">
    <span class="stat-label">ライフ / 敵</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span class="stat-val" id="life-disp" style="color: #f43f5e;">❤❤❤</span>
      <span class="stat-sub" id="enemy-disp">👾×1</span>
    </div>
  </div>
</header>

<div id="game-wrapper">
  <div id="canvas-container">
    <canvas id="gameCanvas" width="300" height="400"></canvas>
    <div id="msg-banner" class="msg-banner">敵を撃破！</div>
    <div id="overlay">
      <h2 id="ov-title">QIX LAND INFINITE</h2>
      <p id="ov-desc">未開拓ゾーンを囲んで陣地を広げよう！<br>敵を小部屋に囲い込めば撃破可能！<br>障害物やアイテムを駆使して無限ステージを突破せよ！</p>
      <button class="btn" id="start-btn">スタート</button>
    </div>
  </div>
</div>

<div id="controls">
  <button class="d-btn" id="d-up">▲</button>
  <button class="d-btn" id="d-left">◀</button>
  <button class="d-btn" id="d-down">▼</button>
  <button class="d-btn" id="d-right">▶</button>
</div>

<script>
// Web Audio 8-bit サウンド生成
class SoundSystem {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playTone(freq, type, duration, vol=0.08) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + duration);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + duration);
  }
  playLine() { this.playTone(520, 'square', 0.03, 0.02); }
  playCut() {
    [440, 554, 659, 880].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'triangle', 0.12, 0.06), i * 30);
    });
  }
  playKill() {
    [220, 440, 880, 1100].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.15, 0.08), i * 35);
    });
  }
  playBuff() {
    [587, 740, 880, 1174].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.14, 0.08), i * 35);
    });
  }
  playDebuff() {
    [300, 260, 220, 180].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.14, 0.08), i * 40);
    });
  }
  playHit() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
  }
  playClear() {
    [523, 659, 783, 1046, 1318].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.22, 0.1), i * 60);
    });
  }
}
const sfx = new SoundSystem();

const GW = 60;
const GH = 80;
const CELL_SIZE = 5; // 300 x 400px

const EMPTY = 0;   // 未開拓
const CLAIMED = 1; // 領土（安全地帯）
const TRAIL = 2;   // 引いている線
const ROCK = 3;    // 障害物（岩：安全地帯にできず、線も接続できない）

let grid = new Uint8Array(GW * GH);
let currentStage = 1;
let highestStage = 1;
let lives = 3;
let isPlaying = false;
let currentAreaPercent = 0;
let stageTargetPercent = 75;

let player = {
  gx: 0, gy: 0,
  vx: 0, vy: 0,
  nextVx: 0, nextVy: 0,
  inClaimed: true,
  trail: [],
  baseDelay: 2,   // 基本の歩進間隔
  speedDelay: 2,
  speedCounter: 0,
  invincibleTimer: 0 // バリア無敵時間
};

let enemies = [];
let items = []; // { gx, gy, type, icon, name }
let activeGimmicks = []; // 今回のステージのギミック名

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovDesc = document.getElementById('ov-desc');
const startBtn = document.getElementById('start-btn');
const areaDisp = document.getElementById('area-disp');
const stageDisp = document.getElementById('stage-disp');
const lifeDisp = document.getElementById('life-disp');
const enemyDisp = document.getElementById('enemy-disp');
const targetDisp = document.getElementById('target-disp');
const msgBanner = document.getElementById('msg-banner');

function showBanner(text, color="#facc15") {
  msgBanner.textContent = text;
  msgBanner.style.color = color;
  msgBanner.style.borderColor = color;
  msgBanner.style.opacity = '1';
  setTimeout(() => { msgBanner.style.opacity = '0'; }, 1800);
}

// 多彩なテーマパレット
const THEMES = [
  { name: "サイバーグリッド", darkBg: "#050814", landCol: (x, y) => ((x ^ y) % 6 === 0 ? "#38bdf8" : (x % 3 === 0 ? "#0369a1" : "#0284c7")) },
  { name: "日本列島グリーン", darkBg: "#031024", landCol: (x, y) => ((x*7 + y*13)%20 === 0 ? "#fb7185" : ((x*7 + y*13)%20 < 8 ? "#22c55e" : "#15803d")) },
  { name: "サバンナゴールド", darkBg: "#021329", landCol: (x, y) => ((x*11 + y*17)%24 < 6 ? "#f59e0b" : ((x*11 + y*17)%24 < 14 ? "#84cc16" : "#d97706")) },
  { name: "マグマコア", darkBg: "#180606", landCol: (x, y) => (((x + y) % 5 === 0) ? "#f97316" : ((x * y) % 7 === 0 ? "#ef4444" : "#991b1b")) },
  { name: "コズミックギャラクシー", darkBg: "#09031c", landCol: (x, y) => ((x*31 + y*47)%33 === 0 ? "#ffffff" : ((x*31 + y*47)%33 < 8 ? "#c084fc" : "#6b21a8")) },
  { name: "アイスブリザード", darkBg: "#04151f", landCol: (x, y) => ((x + y*2)%7 === 0 ? "#e0f2fe" : ((x^y)%4 === 0 ? "#7dd3fc" : "#0284c7")) },
  { name: "ディープフォレスト", darkBg: "#05160e", landCol: (x, y) => ((x*y)%9 === 0 ? "#a3e635" : ((x+y)%5 === 0 ? "#16a34a" : "#065f46")) },
  { name: "ネオントウキョウ", darkBg: "#160517", landCol: (x, y) => ((x*3 + y)%8 === 0 ? "#f43f5e" : ((x^y)%5 === 0 ? "#e879f9" : "#86198f")) }
];

// 日本地図プロット
function plotJapanMap() {
  const setCell = (x, y) => { if (x >= 0 && x < GW && y >= 0 && y < GH) grid[y * GW + x] = CLAIMED; };
  const fillEllipse = (cx, cy, rx, ry, tilt=0) => {
    const cos = Math.cos(tilt), sin = Math.sin(tilt);
    for (let y = cy - ry - 2; y <= cy + ry + 2; y++) {
      for (let x = cx - rx - 2; x <= cx + rx + 2; x++) {
        const dx = x - cx, dy = y - cy;
        const nx = cos * dx - sin * dy;
        const ny = sin * dx + cos * dy;
        if ((nx*nx)/(rx*rx) + (ny*ny)/(ry*ry) <= 1) setCell(x, y);
      }
    }
  };
  fillEllipse(44, 15, 8, 5, 0.2); // 北海道
  fillEllipse(40, 20, 4, 3, -0.5);
  fillEllipse(41, 27, 4, 6, -0.1); // 東北
  fillEllipse(39, 39, 6, 5, 0.3);  // 関東
  fillEllipse(33, 43, 6, 6, -0.4); // 中部
  fillEllipse(27, 49, 4, 5, 0.2);  // 近畿
  fillEllipse(19, 49, 7, 3, -0.2); // 中国
  fillEllipse(22, 57, 5, 3, -0.3); // 四国
  fillEllipse(14, 59, 4, 6, 0.2);  // 九州
  fillEllipse(8, 72, 2, 2, 0.5);   // 沖縄
}

// 世界地図プロット
function plotWorldMap() {
  const fillBlob = (cx, cy, rx, ry, tilt=0) => {
    const cos = Math.cos(tilt), sin = Math.sin(tilt);
    for (let y = cy - ry - 2; y <= cy + ry + 2; y++) {
      for (let x = cx - rx - 2; x <= cx + rx + 2; x++) {
        const dx = x - cx, dy = y - cy;
        const nx = cos * dx - sin * dy;
        const ny = sin * dx + cos * dy;
        if ((nx*nx)/(rx*rx) + (ny*ny)/(ry*ry) <= 1) {
          if (x >= 0 && x < GW && y >= 0 && y < GH) grid[y * GW + x] = CLAIMED;
        }
      }
    }
  };
  fillBlob(15, 20, 8, 7, 0.2);  // 北米
  fillBlob(9, 14, 5, 4, -0.2);
  fillBlob(21, 48, 6, 11, 0.3); // 南米
  fillBlob(34, 19, 5, 4, 0.1);  // 欧州
  fillBlob(35, 38, 7, 10, 0.1); // アフリカ
  fillBlob(45, 20, 11, 7, -0.1);// ユーラシア
  fillBlob(50, 56, 6, 5, 0);    // 豪州
}

// 岩（障害物）配置
function placeRock(cx, cy, r) {
  for (let y = cy - r - 1; y <= cy + r + 1; y++) {
    for (let x = cx - r - 1; x <= cx + r + 1; x++) {
      if (Math.hypot(x - cx, y - cy) <= r) {
        if (x >= 2 && x < GW - 2 && y >= 2 && y < GH - 2) {
          grid[y * GW + x] = ROCK;
        }
      }
    }
  }
}

// ステージ初期化（無限ステージジェネレーター）
function initStage(stg) {
  grid.fill(EMPTY);
  items = [];
  activeGimmicks = [];
  player.speedDelay = player.baseDelay;
  player.invincibleTimer = 0;

  // 目標％ (基本75%、高難度で微増、最大80%)
  stageTargetPercent = Math.min(80, 70 + Math.floor(stg / 3));
  targetDisp.textContent = `${stageTargetPercent}%`;

  // 地形パターンの決定
  const mapType = (stg - 1) % 5;
  if (mapType === 0) {
    // 外枠スタート
    for (let x = 0; x < GW; x++) {
      for (let y = 0; y < GH; y++) {
        if (x < 2 || x >= GW - 2 || y < 2 || y >= GH - 2) grid[y * GW + x] = CLAIMED;
      }
    }
    player.gx = 2; player.gy = 2;
  } else if (mapType === 1) {
    plotJapanMap();
    player.gx = 39; player.gy = 39; // 東京付近
    activeGimmicks.push("日本列島スタート");
  } else if (mapType === 2) {
    // センター孤島
    const cx = GW / 2, cy = GH / 2;
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        if (Math.hypot(x - cx, y - cy) <= 10) grid[y * GW + x] = CLAIMED;
      }
    }
    player.gx = Math.floor(cx); player.gy = Math.floor(cy);
    activeGimmicks.push("孤島脱出");
  } else if (mapType === 3) {
    plotWorldMap();
    player.gx = 35; player.gy = 20; // 欧州
    activeGimmicks.push("世界の大陸");
  } else {
    // 四隅の砦
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        if ((x < 10 && y < 10) || (x > GW - 10 && y < 10) || (x < 10 && y > GH - 10) || (x > GW - 10 && y > GH - 10)) {
          grid[y * GW + x] = CLAIMED;
        }
      }
    }
    player.gx = 5; player.gy = 5;
    activeGimmicks.push("四隅の砦");
  }

  // ギミック1: 岩の配置 (ステージ2以降、限定的に1〜2個出現)
  if (stg >= 2 && mapType !== 1) {
    placeRock(Math.floor(GW * 0.35), Math.floor(GH * 0.4), 3);
    activeGimmicks.push("黒曜石の岩");
    if (stg >= 6) {
      placeRock(Math.floor(GW * 0.65), Math.floor(GH * 0.6), 4);
    }
  }

  // 敵の生成（ごちゃごちゃしないよう最大3体までに制限）
  enemies = [];
  const baseSpeed = 1.6 + Math.min(1.4, stg * 0.12);

  // 敵1: 必ず出る標準タイプ（ステージで性格変化）
  if (stg % 3 === 0) {
    // バウンサー（蛇行）
    enemies.push({ x: 25 * CELL_SIZE, y: 35 * CELL_SIZE, vx: baseSpeed * 0.9, vy: baseSpeed * 0.7, r: 8, type: 'BOUNCE', color: '#fb923c', name: 'スネーク' });
  } else if (stg % 4 === 0) {
    // ボス（大型）
    enemies.push({ x: 30 * CELL_SIZE, y: 40 * CELL_SIZE, vx: baseSpeed * 0.7, vy: baseSpeed * 0.8, r: 15, type: 'BOSS', color: '#ef4444', name: 'ギガボム' });
    activeGimmicks.push("大型ボス出現");
  } else {
    // スピード型
    enemies.push({ x: 30 * CELL_SIZE, y: 30 * CELL_SIZE, vx: baseSpeed, vy: baseSpeed * 0.8, r: 8, type: 'NORMAL', color: '#f43f5e', name: 'スライム' });
  }

  // 敵2: ステージ3以上で追加
  if (stg >= 3) {
    enemies.push({ x: 45 * CELL_SIZE, y: 55 * CELL_SIZE, vx: -baseSpeed * 0.85, vy: baseSpeed * 0.95, r: 7, type: 'FAST', color: '#a855f7', name: 'コメット' });
  }

  // 敵3: ステージ7以上で追加（最大3体）
  if (stg >= 7) {
    enemies.push({ x: 20 * CELL_SIZE, y: 60 * CELL_SIZE, vx: baseSpeed * 0.9, vy: -baseSpeed * 0.8, r: 8, type: 'NORMAL', color: '#38bdf8', name: 'パルサー' });
  }

  // アイテムの配置（1つの面に1〜2個厳選して配置）
  // 候補: SPEED_UP, SPEED_DOWN, FREEZE, BOMB, HEART, SHIELD
  const allItemTypes = [
    { type: 'SPEED_UP', icon: '⚡', name: 'スピードUP' },
    { type: 'SPEED_DOWN', icon: '🐌', name: 'スピードダウン' },
    { type: 'FREEZE', icon: '❄', name: '敵氷結ストップ' },
    { type: 'BOMB', icon: '💣', name: '敵撃破ボム' },
    { type: 'HEART', icon: '💖', name: 'ライフ回復' },
    { type: 'SHIELD', icon: '🛡', name: '無敵バリア' }
  ];

  // ステージに応じて2種類選択
  const it1 = allItemTypes[(stg) % allItemTypes.length];
  const it2 = allItemTypes[(stg + 3) % allItemTypes.length];
  
  // 安全なEMPTY位置に配置
  const findEmptyCell = () => {
    for (let attempts = 0; attempts < 100; attempts++) {
      const rx = 5 + Math.floor(Math.random() * (GW - 10));
      const ry = 5 + Math.floor(Math.random() * (GH - 10));
      if (grid[ry * GW + rx] === EMPTY) return { gx: rx, gy: ry };
    }
    return { gx: 30, gy: 50 };
  };

  const p1 = findEmptyCell();
  items.push({ gx: p1.gx, gy: p1.gy, type: it1.type, icon: it1.icon, name: it1.name });

  if (stg >= 2) {
    const p2 = findEmptyCell();
    items.push({ gx: p2.gx, gy: p2.gy, type: it2.type, icon: it2.icon, name: it2.name });
  }

  player.vx = 0; player.vy = 0;
  player.nextVx = 0; player.nextVy = 0;
  player.inClaimed = true;
  player.trail = [];
  updateStats();
}

function updateStats() {
  let claimedCount = 0;
  let totalValid = 0;
  for (let i = 0; i < GW * GH; i++) {
    if (grid[i] !== ROCK) totalValid++;
    if (grid[i] === CLAIMED) claimedCount++;
  }
  currentAreaPercent = Math.floor((claimedCount / totalValid) * 100);
  areaDisp.textContent = `${currentAreaPercent}%`;
  stageDisp.textContent = `STAGE ${currentStage}`;
  lifeDisp.textContent = '❤'.repeat(Math.max(0, lives));
  enemyDisp.textContent = `👾×${enemies.length}`;
}

// 囲い込み処理 (Flood Fill)
function fillEnclosedArea() {
  // TRAIL を一時的に CLAIMED としてマーク
  player.trail.forEach(pt => { grid[pt.y * GW + pt.x] = CLAIMED; });

  const visited = new Uint8Array(GW * GH);
  const queue = [];
  const survivingEnemies = [];

  // 各敵のいるマスから探索
  enemies.forEach(e => {
    const egx = Math.max(0, Math.min(GW - 1, Math.floor(e.x / CELL_SIZE)));
    const egy = Math.max(0, Math.min(GH - 1, Math.floor(e.y / CELL_SIZE)));
    const idx = egy * GW + egx;

    if (grid[idx] === CLAIMED) {
      // 囲まれて圧死
      sfx.playKill();
      showBanner(`【撃破!!】${e.name} を囲んで倒した！`, '#f43f5e');
      return;
    }
    if (visited[idx] === 0) {
      visited[idx] = 1;
      queue.push(egx, egy);
    }
    survivingEnemies.push(e);
  });

  let head = 0;
  while(head < queue.length) {
    const qx = queue[head++];
    const qy = queue[head++];

    const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
    for (let i = 0; i < 4; i++) {
      const nx = qx + dirs[i][0];
      const ny = qy + dirs[i][1];
      if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
        const nIdx = ny * GW + nx;
        // ROCK や CLAIMED は通れない
        if (grid[nIdx] === EMPTY && visited[nIdx] === 0) {
          visited[nIdx] = 1;
          queue.push(nx, ny);
        }
      }
    }
  }

  // 敵の到達しない EMPTY セルを CLAIMED に変換
  // ※ROCKはそのまま残る（囲まれれば消える処理：周囲がすべてCLAIMEDなら消滅）
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = y * GW + x;
      if (grid[idx] === EMPTY && visited[idx] === 0) {
        grid[idx] = CLAIMED;
      }
    }
  }

  // 岩（ROCK）の消滅判定：岩の周囲に EMPTY が存在しなければ岩を領土に変換！
  let rocksCleared = false;
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = y * GW + x;
      if (grid[idx] === ROCK) {
        // 周囲4方向に未開拓EMPTYがないかチェック
        let hasEmptyNeighbor = false;
        const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
        for (let i = 0; i < 4; i++) {
          const nx = x + dirs[i][0];
          const ny = y + dirs[i][1];
          if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
            if (grid[ny * GW + nx] === EMPTY) { hasEmptyNeighbor = true; break; }
          }
        }
        if (!hasEmptyNeighbor) {
          grid[idx] = CLAIMED;
          rocksCleared = true;
        }
      }
    }
  }
  if (rocksCleared) {
    showBanner("🪨 邪魔な岩を完全包囲して粉砕！", "#38bdf8");
  }

  // 敵の完全圧殺チェック
  const finalEnemies = [];
  survivingEnemies.forEach(e => {
    const egx = Math.max(0, Math.min(GW - 1, Math.floor(e.x / CELL_SIZE)));
    const egy = Math.max(0, Math.min(GH - 1, Math.floor(e.y / CELL_SIZE)));
    if (grid[egy * GW + egx] === CLAIMED) {
      sfx.playKill();
      showBanner(`【撃破!!】${e.name} を囲んで倒した！`, '#f43f5e');
    } else {
      finalEnemies.push(e);
    }
  });
  enemies = finalEnemies;

  // アイテム取得判定
  items = items.filter(it => {
    if (grid[it.gy * GW + it.gx] === CLAIMED) {
      applyItem(it);
      return false;
    }
    return true;
  });

  player.trail = [];
  sfx.playCut();
  updateStats();

  if (enemies.length === 0) {
    showBanner("👾 敵を全滅！ステージ制覇！", "#38bdf8");
  }

  if (currentAreaPercent >= stageTargetPercent || enemies.length === 0) {
    handleStageClear();
  }
}

// アイテム効果
function applyItem(it) {
  if (it.type === 'SPEED_UP') {
    sfx.playBuff();
    player.speedDelay = 1; // 2倍速
    setTimeout(() => { player.speedDelay = player.baseDelay; }, 7000);
    showBanner("⚡ スピードアップ！(7秒間)", "#facc15");
  } else if (it.type === 'SPEED_DOWN') {
    sfx.playDebuff();
    player.speedDelay = 3; // 減速
    setTimeout(() => { player.speedDelay = player.baseDelay; }, 6000);
    showBanner("🐌 スピードダウン！足が重い…", "#94a3b8");
  } else if (it.type === 'FREEZE') {
    sfx.playBuff();
    enemies.forEach(e => { e.savedVx = e.vx; e.savedVy = e.vy; e.vx = 0; e.vy = 0; });
    setTimeout(() => {
      enemies.forEach(e => { e.vx = e.savedVx || 1.5; e.vy = e.savedVy || 1.5; });
    }, 4500);
    showBanner("❄ 敵が4.5秒間氷結完全停止！", "#38bdf8");
  } else if (it.type === 'BOMB') {
    sfx.playKill();
    if (enemies.length > 0) {
      const dead = enemies.pop();
      showBanner(`💣 ボム爆発！ ${dead.name} を粉砕！`, "#f97316");
    }
  } else if (it.type === 'HEART') {
    sfx.playBuff();
    lives = Math.min(5, lives + 1);
    showBanner("💖 ライフが1つ回復した！", "#f43f5e");
  } else if (it.type === 'SHIELD') {
    sfx.playBuff();
    player.invincibleTimer = 300; // 約5秒間無敵
    showBanner("🛡 バリア展開！5秒間敵の攻撃を無効化！", "#a855f7");
  }
  updateStats();
}

function handleStageClear() {
  isPlaying = false;
  sfx.playClear();
  currentStage++;
  if (currentStage > highestStage) highestStage = currentStage;

  const nextTheme = THEMES[(currentStage - 1) % THEMES.length];
  ovTitle.textContent = `🎉 STAGE ${currentStage - 1} クリア！`;
  ovDesc.textContent = `クリア面数: ${currentStage - 1} 面達成！
次は『STAGE ${currentStage}: ${nextTheme.name}』です。`;
  startBtn.textContent = `STAGE ${currentStage} へ進む`;
  overlay.style.display = 'flex';
}

function handleDeath() {
  if (player.invincibleTimer > 0) return; // 無敵中

  sfx.playHit();
  lives--;
  updateStats();

  player.trail.forEach(pt => { grid[pt.y * GW + pt.x] = EMPTY; });
  player.trail = [];
  player.vx = 0; player.vy = 0;
  player.nextVx = 0; player.nextVy = 0;

  if (lives <= 0) {
    isPlaying = false;
    ovTitle.textContent = 'ゲームオーバー';
    ovDesc.textContent = `到達ステージ: STAGE ${currentStage}
クリア面数: ${currentStage - 1} 面
再挑戦してハイスコアを目指そう！`;
    startBtn.textContent = 'STAGE 1 から再挑戦';
    overlay.style.display = 'flex';
    currentStage = 1;
    lives = 3;
  } else {
    // 最寄りの安全地帯へ復帰
    let found = false;
    for (let r = 0; r < GW && !found; r++) {
      for (let dy = -r; dy <= r && !found; dy++) {
        for (let dx = -r; dx <= r && !found; dx++) {
          const nx = player.gx + dx;
          const ny = player.gy + dy;
          if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
            if (grid[ny * GW + nx] === CLAIMED) {
              player.gx = nx;
              player.gy = ny;
              player.inClaimed = true;
              found = true;
            }
          }
        }
      }
    }
  }
}

function updatePlayer() {
  if (player.invincibleTimer > 0) player.invincibleTimer--;

  player.speedCounter++;
  if (player.speedCounter % player.speedDelay !== 0) return;

  if (player.nextVx !== 0 || player.nextVy !== 0) {
    player.vx = player.nextVx;
    player.vy = player.nextVy;
  }
  if (player.vx === 0 && player.vy === 0) return;

  const nx = player.gx + player.vx;
  const ny = player.gy + player.vy;

  if (nx < 0 || nx >= GW || ny < 0 || ny >= GH) {
    player.vx = 0; player.vy = 0;
    return;
  }

  const target = grid[ny * GW + nx];

  // 岩（ROCK）には突っ込めない（壁としてストップ）
  if (target === ROCK) {
    player.vx = 0; player.vy = 0;
    player.nextVx = 0; player.nextVy = 0;
    return;
  }

  if (target === TRAIL) {
    handleDeath();
    return;
  }

  player.gx = nx;
  player.gy = ny;

  if (target === CLAIMED) {
    if (!player.inClaimed) {
      fillEnclosedArea();
      player.inClaimed = true;
    }
  } else if (target === EMPTY) {
    player.inClaimed = false;
    grid[ny * GW + nx] = TRAIL;
    player.trail.push({ x: nx, y: ny });
    sfx.playLine();
  }
}

function updateEnemies() {
  enemies.forEach(e => {
    if (e.vx === 0 && e.vy === 0) return; // 氷結中

    if (e.type === 'BOUNCE') {
      e.vy += Math.sin(Date.now() * 0.005) * 0.04;
    }

    e.x += e.vx;
    e.y += e.vy;

    const gx = Math.floor(e.x / CELL_SIZE);
    const gy = Math.floor(e.y / CELL_SIZE);

    if (e.x - e.r < 0 || e.x + e.r >= GW * CELL_SIZE) e.vx *= -1;
    if (e.y - e.r < 0 || e.y + e.r >= GH * CELL_SIZE) e.vy *= -1;

    const checkRadius = Math.ceil(e.r / CELL_SIZE);
    for (let dy = -checkRadius; dy <= checkRadius; dy++) {
      for (let dx = -checkRadius; dx <= checkRadius; dx++) {
        const cx = gx + dx;
        const cy = gy + dy;
        if (cx >= 0 && cx < GW && cy >= 0 && cy < GH) {
          const cell = grid[cy * GW + cx];
          const cellCenterX = cx * CELL_SIZE + CELL_SIZE / 2;
          const cellCenterY = cy * CELL_SIZE + CELL_SIZE / 2;
          const dist = Math.hypot(e.x - cellCenterX, e.y - cellCenterY);

          // CLAIMED または ROCK でバウンド反射
          if ((cell === CLAIMED || cell === ROCK) && dist < e.r + CELL_SIZE / 2) {
            if (Math.abs(e.x - cellCenterX) > Math.abs(e.y - cellCenterY)) {
              e.vx *= -1; e.x += e.vx * 1.2;
            } else {
              e.vy *= -1; e.y += e.vy * 1.2;
            }
          }
          if (cell === TRAIL && dist < e.r + CELL_SIZE / 2) {
            handleDeath();
            return;
          }
        }
      }
    }

    // プレイヤー接触
    const pRealX = player.gx * CELL_SIZE + CELL_SIZE / 2;
    const pRealY = player.gy * CELL_SIZE + CELL_SIZE / 2;
    if (!player.inClaimed && Math.hypot(e.x - pRealX, e.y - pRealY) < e.r + CELL_SIZE / 2) {
      handleDeath();
    }
  });
}

function draw() {
  const theme = THEMES[(currentStage - 1) % THEMES.length];
  ctx.fillStyle = theme.darkBg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 1. グリッド描画
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const c = grid[y * GW + x];
      if (c === CLAIMED) {
        ctx.fillStyle = theme.landCol(x, y);
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      } else if (c === TRAIL) {
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      } else if (c === ROCK) {
        // 岩：漆黒の鉱石ブロック
        ctx.fillStyle = (x + y) % 2 === 0 ? '#475569' : '#334155';
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
    }
  }

  // 2. アイテム描画
  items.forEach(it => {
    const ix = it.gx * CELL_SIZE + CELL_SIZE / 2;
    const iy = it.gy * CELL_SIZE + CELL_SIZE / 2;
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.icon, ix, iy);
  });

  // 3. 敵描画
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI * 2);
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = e.color;
    ctx.fill();
    ctx.shadowBlur = 0;

    // 氷結エフェクト
    if (e.vx === 0 && e.vy === 0) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 目
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-e.r * 0.35, -e.r * 0.15, e.r * 0.28, 0, Math.PI*2);
    ctx.arc(e.r * 0.35, -e.r * 0.15, e.r * 0.28, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(-e.r * 0.3, -e.r * 0.15, e.r * 0.14, 0, Math.PI*2);
    ctx.arc(e.r * 0.4, -e.r * 0.15, e.r * 0.14, 0, Math.PI*2);
    ctx.fill();

    if (e.type === 'BOSS') {
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(-e.r*0.6, -e.r*0.8);
      ctx.lineTo(-e.r*0.3, -e.r*1.2);
      ctx.lineTo(0, -e.r*0.8);
      ctx.lineTo(e.r*0.3, -e.r*1.2);
      ctx.lineTo(e.r*0.6, -e.r*0.8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  });

  // 4. プレイヤー描画
  const px = player.gx * CELL_SIZE;
  const py = player.gy * CELL_SIZE;
  ctx.fillStyle = player.invincibleTimer > 0 ? '#ec4899' : '#fde047';
  if (player.invincibleTimer > 0) {
    ctx.shadowBlur = 12; ctx.shadowColor = '#ec4899';
  } else {
    ctx.shadowBlur = 8; ctx.shadowColor = '#facc15';
  }
  ctx.fillRect(px - 1, py - 1, CELL_SIZE + 2, CELL_SIZE + 2);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(px + 1, py + 1, 2, 2);
}

function gameLoop() {
  if (isPlaying) {
    updatePlayer();
    updateEnemies();
    draw();
  }
  requestAnimationFrame(gameLoop);
}

function setDirection(x, y) {
  if (player.trail.length > 0) {
    if (x === -player.vx && y === 0) return;
    if (y === -player.vy && x === 0) return;
  }
  player.nextVx = x;
  player.nextVy = y;
}

window.addEventListener('keydown', e => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) { setDirection(0, -1); e.preventDefault(); }
  if (['ArrowDown', 'KeyS'].includes(e.code)) { setDirection(0, 1); e.preventDefault(); }
  if (['ArrowLeft', 'KeyA'].includes(e.code)) { setDirection(-1, 0); e.preventDefault(); }
  if (['ArrowRight', 'KeyD'].includes(e.code)) { setDirection(1, 0); e.preventDefault(); }
});

const bindBtn = (id, x, y) => {
  const el = document.getElementById(id);
  const trigger = (e) => {
    e.preventDefault();
    sfx.init();
    setDirection(x, y);
    el.classList.add('active');
  };
  const release = () => el.classList.remove('active');
  el.addEventListener('touchstart', trigger, { passive: false });
  el.addEventListener('touchend', release);
  el.addEventListener('mousedown', trigger);
  el.addEventListener('mouseup', release);
};

bindBtn('d-up', 0, -1);
bindBtn('d-down', 0, 1);
bindBtn('d-left', -1, 0);
bindBtn('d-right', 1, 0);

// スワイプ操作
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  sfx.init();
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (!touchStartX || !touchStartY) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (Math.hypot(dx, dy) > 18) {
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
    else setDirection(0, dy > 0 ? 1 : -1);
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

startBtn.addEventListener('click', () => {
  sfx.init();
  overlay.style.display = 'none';
  initStage(currentStage);
  isPlaying = true;
});

initStage(1);
draw();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
