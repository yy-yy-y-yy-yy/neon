<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Qix Land Infinite - iPhone 15 Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #030712;
    color: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100dvh;
    padding-top: calc(max(10px, env(safe-area-inset-top)));
    padding-bottom: calc(max(10px, env(safe-area-inset-bottom)));
    padding-left: 12px;
    padding-right: 12px;
    touch-action: none;
    overflow: hidden;
  }
  header {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    flex-shrink: 0;
  }
  .stat-col { display: flex; flex-direction: column; align-items: center; }
  .stat-label { font-size: 10px; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; }
  .stat-val { font-size: 16px; font-weight: 900; color: #38bdf8; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 11px; color: #fbbf24; font-weight: 800; }

  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 420px;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 6px 0;
    overflow: hidden;
  }
  #canvas-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-height: 100%;
    aspect-ratio: 54 / 117; /* iPhone 15 比率 (約 9:19.5) */
    background: #020617;
    border: 2px solid #334155;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.85);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(4, 7, 18, 0.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    backdrop-filter: blur(8px);
    z-index: 20;
  }
  #overlay h2 { font-size: 24px; color: #38bdf8; margin-bottom: 12px; font-weight: 900; }
  #overlay p { font-size: 13px; color: #cbd5e1; margin-bottom: 22px; line-height: 1.6; white-space: pre-line; }
  .btn {
    background: linear-gradient(135deg, #0284c7, #2563eb);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    padding: 13px 38px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(14, 165, 233, 0.45);
    transition: transform 0.1s, opacity 0.1s;
  }
  .btn:active { transform: scale(0.96); opacity: 0.9; }

  .msg-banner {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid #38bdf8;
    color: #facc15;
    font-size: 12px;
    font-weight: 800;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    white-space: nowrap;
    z-index: 10;
  }
</style>
</head>
<body>

<header>
  <div class="stat-col">
    <span class="stat-label">ステージ</span>
    <span class="stat-val" id="stage-disp">STAGE 1</span>
  </div>
  <div class="stat-col">
    <span class="stat-label">領土 (目標 <span id="target-disp">75%</span>)</span>
    <span class="stat-val" id="area-disp">0%</span>
  </div>
  <div class="stat-col">
    <span class="stat-label">ライフ / 敵</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span class="stat-val" id="life-disp" style="color: #f43f5e;">❤❤❤</span>
      <span class="stat-sub" id="enemy-disp">👾×1</span>
    </div>
  </div>
</header>

<div id="game-wrapper">
  <div id="canvas-container">
    <canvas id="gameCanvas" width="270" height="585"></canvas>
    <div id="msg-banner" class="msg-banner">敵を撃破！</div>
    <div id="overlay">
      <h2 id="ov-title">QIX INFINITE 15</h2>
      <p id="ov-desc">画面スワイプで線を伸ばし、敵を囲い込め！
縦長画面＆毎回異なるランダム面を攻略せよ。
自分の線に当たっても死なずに壁として止まります。</p>
      <button class="btn" id="start-btn">スタート</button>
    </div>
  </div>
</div>

<script>
class SoundSystem {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playTone(freq, type, duration, vol=0.08) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + duration);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + duration);
  }
  playLine() { this.playTone(540, 'square', 0.025, 0.02); }
  playCut() {
    [440, 587, 659, 880].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'triangle', 0.1, 0.06), i * 30);
    });
  }
  playKill() {
    [240, 480, 720, 1080].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.15, 0.08), i * 35);
    });
  }
  playBuff() {
    [520, 650, 780, 1040].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.13, 0.08), i * 30);
    });
  }
  playDebuff() {
    [320, 260, 200, 150].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.14, 0.07), i * 40);
    });
  }
  playHit() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(190, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.28);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.28);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.28);
  }
  playClear() {
    [523, 659, 783, 1046, 1318].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.22, 0.09), i * 55);
    });
  }
}
const sfx = new SoundSystem();

// iPhone 15 縦長アスペクト (54 x 117 = 9 : 19.5, CELL_SIZE=5)
const GW = 54;
const GH = 117;
const CELL_SIZE = 5;

const EMPTY = 0;   // 未開拓
const CLAIMED = 1; // 領土
const TRAIL = 2;   // 引いている線
const ROCK = 3;    // 岩（障害物）

let grid = new Uint8Array(GW * GH);
let currentStage = 1;
let highestStage = 1;
let lives = 3;
let isPlaying = false;
let currentAreaPercent = 0;
let stageTargetPercent = 75;

let spawnPoint = { x: 2, y: 2 };

let player = {
  gx: 0, gy: 0,
  vx: 0, vy: 0,
  nextVx: 0, nextVy: 0,
  inClaimed: true,
  trail: [],
  baseDelay: 2,
  speedDelay: 2,
  speedCounter: 0,
  invincibleTimer: 0
};

let enemies = [];
let items = [];

let stageTheme = {
  bg: '#040714',
  landBase: '#0284c7',
  landAccent: '#38bdf8'
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovDesc = document.getElementById('ov-desc');
const startBtn = document.getElementById('start-btn');
const areaDisp = document.getElementById('area-disp');
const stageDisp = document.getElementById('stage-disp');
const lifeDisp = document.getElementById('life-disp');
const enemyDisp = document.getElementById('enemy-disp');
const targetDisp = document.getElementById('target-disp');
const msgBanner = document.getElementById('msg-banner');

function showBanner(text, color="#facc15") {
  msgBanner.textContent = text;
  msgBanner.style.color = color;
  msgBanner.style.borderColor = color;
  msgBanner.style.opacity = '1';
  msgBanner.style.transform = 'translate(-50%, 0) scale(1.05)';
  setTimeout(() => {
    msgBanner.style.opacity = '0';
    msgBanner.style.transform = 'translate(-50%, -4px) scale(0.98)';
  }, 1900);
}

// テーマの動的ランダム生成
function generateDynamicTheme(stg) {
  const hues = [200, 145, 35, 275, 340, 175, 25];
  const hue = hues[(stg - 1) % hues.length];
  return {
    bg: `hsl(${hue}, 45%, 4%)`,
    landBase: `hsl(${hue}, 80%, 35%)`,
    landAccent: `hsl(${(hue + 25) % 360}, 90%, 55%)`
  };
}

// セル単位の岩安全配置
function placeRockCluster(cx, cy, r) {
  for (let y = cy - r - 1; y <= cy + r + 1; y++) {
    for (let x = cx - r - 1; x <= cx + r + 1; x++) {
      if (Math.hypot(x - cx, y - cy) <= r) {
        if (x >= 4 && x < GW - 4 && y >= 4 && y < GH - 4) {
          let nearClaimed = false;
          for (let dy = -3; dy <= 3; dy++) {
            for (let dx = -3; dx <= 3; dx++) {
              const nx = x + dx, ny = y + dy;
              if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
                if (grid[ny * GW + nx] === CLAIMED) { nearClaimed = true; break; }
              }
            }
            if (nearClaimed) break;
          }
          if (!nearClaimed && grid[y * GW + x] === EMPTY) {
            grid[y * GW + x] = ROCK;
          }
        }
      }
    }
  }
}

// 完全ランダムな初期領土地形の生成
function generateRandomTerrain(stg) {
  const mode = Math.floor(Math.random() * 5);
  let pSpawn = { x: 2, y: 2 };

  if (mode === 0) {
    // 1. クラシック外周枠
    const border = 2;
    for (let x = 0; x < GW; x++) {
      for (let y = 0; y < GH; y++) {
        if (x < border || x >= GW - border || y < border || y >= GH - border) {
          grid[y * GW + x] = CLAIMED;
        }
      }
    }
    pSpawn = { x: border, y: border };
  } else if (mode === 1) {
    // 2. 上下デュアルコア（北極と南極）
    const border = 2;
    for (let x = 0; x < GW; x++) {
      for (let y = 0; y < GH; y++) {
        if (x < border || x >= GW - border || y < 14 || y >= GH - 14) {
          grid[y * GW + x] = CLAIMED;
        }
      }
    }
    pSpawn = { x: Math.floor(GW / 2), y: 13 };
  } else if (mode === 2) {
    // 3. 中央浮島 + 外周
    for (let x = 0; x < GW; x++) {
      for (let y = 0; y < GH; y++) {
        if (x < 2 || x >= GW - 2 || y < 2 || y >= GH - 2) grid[y * GW + x] = CLAIMED;
      }
    }
    const cx = GW / 2, cy = GH / 2;
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        if (Math.hypot(x - cx, y - cy) <= 9) grid[y * GW + x] = CLAIMED;
      }
    }
    pSpawn = { x: Math.floor(cx), y: Math.floor(cy) };
  } else if (mode === 3) {
    // 4. 十字ハイウェイ
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        if (Math.abs(x - GW/2) <= 2 || Math.abs(y - GH/2) <= 3 || x < 2 || x >= GW - 2 || y < 2 || y >= GH - 2) {
          grid[y * GW + x] = CLAIMED;
        }
      }
    }
    pSpawn = { x: Math.floor(GW / 2), y: Math.floor(GH / 2) };
  } else {
    // 5. 3点ポディウム（上・中・下の島）
    for (let x = 0; x < GW; x++) {
      for (let y = 0; y < GH; y++) {
        if (x < 2 || x >= GW - 2 || y < 2 || y >= GH - 2) grid[y * GW + x] = CLAIMED;
      }
    }
    const spots = [{x: GW/2, y: GH*0.25}, {x: GW/2, y: GH*0.75}];
    spots.forEach(sp => {
      for (let y = 0; y < GH; y++) {
        for (let x = 0; x < GW; x++) {
          if (Math.hypot(x - sp.x, y - sp.y) <= 8) grid[y * GW + x] = CLAIMED;
        }
      }
    });
    pSpawn = { x: Math.floor(GW / 2), y: Math.floor(GH * 0.25) };
  }

  // ランダム岩礁クラスタ（1〜3箇所）
  const rockCount = Math.min(4, 1 + Math.floor(stg / 2));
  for (let i = 0; i < rockCount; i++) {
    const rcx = 8 + Math.floor(Math.random() * (GW - 16));
    const rcy = 15 + Math.floor(Math.random() * (GH - 30));
    placeRockCluster(rcx, rcy, 2 + Math.floor(Math.random() * 2));
  }

  return pSpawn;
}

// 敵の安全湧き位置探索
function findSafeEnemySpawn(radius) {
  for (let attempt = 0; attempt < 600; attempt++) {
    const rx = radius + 4 + Math.random() * (GW * CELL_SIZE - (radius + 4) * 2);
    const ry = radius + 4 + Math.random() * (GH * CELL_SIZE - (radius + 4) * 2);

    let isSafe = true;
    const checkRadiusCells = Math.ceil((radius + 6) / CELL_SIZE);
    const egx = Math.floor(rx / CELL_SIZE);
    const egy = Math.floor(ry / CELL_SIZE);

    for (let dy = -checkRadiusCells; dy <= checkRadiusCells; dy++) {
      for (let dx = -checkRadiusCells; dx <= checkRadiusCells; dx++) {
        const cx = egx + dx;
        const cy = egy + dy;
        if (cx >= 0 && cx < GW && cy >= 0 && cy < GH) {
          const cell = grid[cy * GW + cx];
          if (cell === CLAIMED || cell === ROCK) {
            const cellCenterX = cx * CELL_SIZE + CELL_SIZE / 2;
            const cellCenterY = cy * CELL_SIZE + CELL_SIZE / 2;
            if (Math.hypot(rx - cellCenterX, ry - cellCenterY) < radius + CELL_SIZE * 2) {
              isSafe = false;
              break;
            }
          }
        }
      }
      if (!isSafe) break;
    }

    if (isSafe) return { x: rx, y: ry };
  }
  return { x: GW * CELL_SIZE / 2, y: GH * CELL_SIZE / 2 };
}

// 敵の種類生成ファクトリ
function createEnemyByType(type, baseSpeed) {
  const p = findSafeEnemySpawn(8);
  if (type === 'SNAKE') {
    return { x: p.x, y: p.y, vx: baseSpeed * 0.9, vy: baseSpeed * 0.7, r: 8, type: 'SNAKE', color: '#fb923c', name: 'スネーク', waveTimer: 0 };
  } else if (type === 'HUNTER') {
    return { x: p.x, y: p.y, vx: baseSpeed * 0.75, vy: baseSpeed * 0.75, r: 8, type: 'HUNTER', color: '#e11d48', name: 'ハンター' };
  } else if (type === 'WARPER') {
    return { x: p.x, y: p.y, vx: baseSpeed * 0.8, vy: baseSpeed * 0.8, r: 8, type: 'WARPER', color: '#a855f7', name: 'ワーパー', warpCooldown: 240 };
  } else if (type === 'BOSS') {
    const bp = findSafeEnemySpawn(14);
    return { x: bp.x, y: bp.y, vx: baseSpeed * 0.65, vy: baseSpeed * 0.7, r: 14, type: 'BOSS', color: '#ef4444', name: 'ギガボム' };
  } else if (type === 'FAST') {
    return { x: p.x, y: p.y, vx: baseSpeed * 1.25, vy: baseSpeed * 1.1, r: 6, type: 'FAST', color: '#38bdf8', name: 'コメット' };
  } else {
    return { x: p.x, y: p.y, vx: baseSpeed, vy: baseSpeed * 0.85, r: 8, type: 'NORMAL', color: '#f43f5e', name: 'ピンボール' };
  }
}

function initStage(stg) {
  grid.fill(EMPTY);
  items = [];
  player.speedDelay = player.baseDelay;
  player.invincibleTimer = 0;

  stageTargetPercent = Math.min(80, 70 + Math.floor(stg / 3));
  targetDisp.textContent = `${stageTargetPercent}%`;

  stageTheme = generateDynamicTheme(stg);

  // ランダム面生成
  const pSpawn = generateRandomTerrain(stg);
  player.gx = pSpawn.x;
  player.gy = pSpawn.y;
  spawnPoint.x = pSpawn.x;
  spawnPoint.y = pSpawn.y;

  // 敵の生成（通常は1〜最大3体）
  enemies = [];
  const baseSpeed = 1.6 + Math.min(1.4, stg * 0.1);
  const enemyPool = ['NORMAL', 'SNAKE', 'HUNTER', 'WARPER', 'FAST'];
  
  if (stg % 4 === 0) {
    enemies.push(createEnemyByType('BOSS', baseSpeed));
  } else {
    enemies.push(createEnemyByType(enemyPool[Math.floor(Math.random() * enemyPool.length)], baseSpeed));
  }

  if (stg >= 2) {
    enemies.push(createEnemyByType(enemyPool[Math.floor(Math.random() * enemyPool.length)], baseSpeed));
  }
  if (stg >= 5) {
    enemies.push(createEnemyByType(enemyPool[Math.floor(Math.random() * enemyPool.length)], baseSpeed));
  }

  // アイテム生成（1ステージ最大2個）
  const allItemTypes = [
    { type: 'SPEED_UP', icon: '⚡', name: 'ターボブースト' },
    { type: 'FREEZE', icon: '❄', name: '絶対零度' },
    { type: 'BOMB', icon: '💣', name: '殲滅ボム' },
    { type: 'HEART', icon: '💖', name: 'ライフ回復' },
    { type: 'SHIELD', icon: '🛡', name: '無敵バリア' },
    { type: 'CUTTER', icon: '✂', name: 'インスタントカッター' },
    { type: 'PANDORA', icon: '🎁', name: 'パンドラの箱' }
  ];

  const findEmptyItemCell = () => {
    for (let attempts = 0; attempts < 300; attempts++) {
      const rx = 4 + Math.floor(Math.random() * (GW - 8));
      const ry = 6 + Math.floor(Math.random() * (GH - 12));
      if (grid[ry * GW + rx] === EMPTY) return { gx: rx, gy: ry };
    }
    return { gx: Math.floor(GW / 2), gy: Math.floor(GH / 2) };
  };

  const countItems = Math.random() < 0.35 ? 1 : 2;
  for (let i = 0; i < countItems; i++) {
    const itDef = allItemTypes[Math.floor(Math.random() * allItemTypes.length)];
    const cell = findEmptyItemCell();
    items.push({ gx: cell.gx, gy: cell.gy, type: itDef.type, icon: itDef.icon, name: itDef.name });
  }

  player.vx = 0; player.vy = 0;
  player.nextVx = 0; player.nextVy = 0;
  player.inClaimed = true;
  player.trail = [];
  updateStats();
}

function updateStats() {
  let claimedCount = 0;
  let totalStageCells = 0;
  for (let i = 0; i < GW * GH; i++) {
    if (grid[i] !== ROCK) {
      totalStageCells++;
      if (grid[i] === CLAIMED) claimedCount++;
    }
  }
  currentAreaPercent = Math.floor((claimedCount / Math.max(1, totalStageCells)) * 100);
  areaDisp.textContent = `${currentAreaPercent}%`;
  stageDisp.textContent = `STAGE ${currentStage}`;
  lifeDisp.textContent = '❤'.repeat(Math.max(0, lives));
  enemyDisp.textContent = `👾×${enemies.length}`;
}

// 囲い込みによる領土確定判定
function fillEnclosedArea() {
  player.trail.forEach(pt => { grid[pt.y * GW + pt.x] = CLAIMED; });

  const visited = new Uint8Array(GW * GH);
  const queue = [];
  const survivingEnemies = [];

  enemies.forEach(e => {
    const egx = Math.max(0, Math.min(GW - 1, Math.floor(e.x / CELL_SIZE)));
    const egy = Math.max(0, Math.min(GH - 1, Math.floor(e.y / CELL_SIZE)));
    const idx = egy * GW + egx;

    if (grid[idx] === CLAIMED) {
      sfx.playKill();
      showBanner(`【撃破!!】${e.name} を囲んで倒した！`, '#f43f5e');
      return;
    }
    if (visited[idx] === 0) {
      visited[idx] = 1;
      queue.push(egx, egy);
    }
    survivingEnemies.push(e);
  });

  let head = 0;
  while (head < queue.length) {
    const qx = queue[head++];
    const qy = queue[head++];

    const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
    for (let i = 0; i < 4; i++) {
      const nx = qx + dirs[i][0];
      const ny = qy + dirs[i][1];
      if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
        const nIdx = ny * GW + nx;
        if (grid[nIdx] === EMPTY && visited[nIdx] === 0) {
          visited[nIdx] = 1;
          queue.push(nx, ny);
        }
      }
    }
  }

  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = y * GW + x;
      if (grid[idx] === EMPTY && visited[idx] === 0) {
        grid[idx] = CLAIMED;
      }
    }
  }

  // 完全に囲まれた岩の粉砕
  let rocksCleared = false;
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = y * GW + x;
      if (grid[idx] === ROCK) {
        let hasEmptyNeighbor = false;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
              if (grid[ny * GW + nx] === EMPTY) {
                hasEmptyNeighbor = true;
                break;
              }
            }
          }
          if (hasEmptyNeighbor) break;
        }
        if (!hasEmptyNeighbor) {
          grid[idx] = CLAIMED;
          rocksCleared = true;
        }
      }
    }
  }
  if (rocksCleared) showBanner("🪨 岩礁を完全包囲して粉砕！", "#38bdf8");

  const finalEnemies = [];
  survivingEnemies.forEach(e => {
    const egx = Math.max(0, Math.min(GW - 1, Math.floor(e.x / CELL_SIZE)));
    const egy = Math.max(0, Math.min(GH - 1, Math.floor(e.y / CELL_SIZE)));
    if (grid[egy * GW + egx] === CLAIMED) {
      sfx.playKill();
      showBanner(`【撃破!!】${e.name} を囲んで倒した！`, '#f43f5e');
    } else {
      finalEnemies.push(e);
    }
  });
  enemies = finalEnemies;

  items = items.filter(it => {
    if (grid[it.gy * GW + it.gx] === CLAIMED) {
      applyItem(it);
      return false;
    }
    return true;
  });

  player.trail = [];
  sfx.playCut();
  updateStats();

  if (enemies.length === 0) showBanner("👾 敵を全滅！ステージ制覇！", "#38bdf8");

  if (currentAreaPercent >= stageTargetPercent || enemies.length === 0) {
    handleStageClear();
  }
}

// アイテム発動
function applyItem(it) {
  if (it.type === 'SPEED_UP') {
    sfx.playBuff();
    player.speedDelay = 1;
    setTimeout(() => { player.speedDelay = player.baseDelay; }, 7000);
    showBanner("⚡ ターボブースト！(7秒間高速化)", "#facc15");
  } else if (it.type === 'FREEZE') {
    sfx.playBuff();
    enemies.forEach(e => { e.savedVx = e.vx; e.savedVy = e.vy; e.vx = 0; e.vy = 0; });
    setTimeout(() => {
      enemies.forEach(e => { e.vx = e.savedVx || 1.4; e.vy = e.savedVy || 1.4; });
    }, 4500);
    showBanner("❄ 敵が4.5秒間氷結完全停止！", "#38bdf8");
  } else if (it.type === 'BOMB') {
    sfx.playKill();
    if (enemies.length > 0) {
      const dead = enemies.pop();
      showBanner(`💣 ボム粉砕！ ${dead.name} を撃破！`, "#f97316");
    }
  } else if (it.type === 'HEART') {
    sfx.playBuff();
    lives = Math.min(5, lives + 1);
    showBanner("💖 ライフが1つ回復した！", "#f43f5e");
  } else if (it.type === 'SHIELD') {
    sfx.playBuff();
    player.invincibleTimer = 300;
    showBanner("🛡 バリア展開！5秒間敵の接触無効！", "#a855f7");
  } else if (it.type === 'CUTTER') {
    sfx.playBuff();
    // 最寄りの領土を探して自動直線接続
    let bestDist = 999;
    let targetX = player.gx, targetY = player.gy;
    for (let dy = -15; dy <= 15; dy++) {
      for (let dx = -15; dx <= 15; dx++) {
        const nx = player.gx + dx;
        const ny = player.gy + dy;
        if (nx >= 0 && nx < GW && ny >= 0 && ny < GH && grid[ny * GW + nx] === CLAIMED) {
          const d = Math.hypot(dx, dy);
          if (d > 1 && d < bestDist) {
            bestDist = d;
            targetX = nx; targetY = ny;
          }
        }
      }
    }
    // 直線補間して領土化
    const steps = Math.ceil(bestDist);
    for (let s = 1; s <= steps; s++) {
      const ix = Math.round(player.gx + (targetX - player.gx) * (s / steps));
      const iy = Math.round(player.gy + (targetY - player.gy) * (s / steps));
      if (grid[iy * GW + ix] === EMPTY) {
        grid[iy * GW + ix] = TRAIL;
        player.trail.push({ x: ix, y: iy });
      }
    }
    player.gx = targetX;
    player.gy = targetY;
    fillEnclosedArea();
    player.inClaimed = true;
    showBanner("✂ インスタントカッター緊急結線！", "#22c55e");
  } else if (it.type === 'PANDORA') {
    // パンドラの箱：50%で大領土ボーナス、50%で敵追加（最大4体まで）
    if (Math.random() < 0.5 || enemies.length >= 4) {
      sfx.playBuff();
      // 一定範囲を即座に領土化
      const cx = it.gx, cy = it.gy;
      for (let dy = -6; dy <= 6; dy++) {
        for (let dx = -6; dx <= 6; dx++) {
          const nx = cx + dx, ny = cy + dy;
          if (nx >= 0 && nx < GW && ny >= 0 && ny < GH && grid[ny * GW + nx] === EMPTY) {
            grid[ny * GW + nx] = CLAIMED;
          }
        }
      }
      showBanner("🎁 パンドラ解放：領土が急速拡大！", "#facc15");
    } else {
      sfx.playDebuff();
      const baseSpeed = 1.6 + Math.min(1.4, currentStage * 0.1);
      const newEnemy = createEnemyByType('FAST', baseSpeed);
      enemies.push(newEnemy);
      showBanner("⚠ パンドラの罠：暴走敵が追加召喚！", "#ef4444");
    }
  }
  updateStats();
}

function handleStageClear() {
  isPlaying = false;
  sfx.playClear();
  currentStage++;
  if (currentStage > highestStage) highestStage = currentStage;

  ovTitle.textContent = `🎉 STAGE ${currentStage - 1} CLEAR!`;
  ovDesc.textContent = `クリア面数: ${currentStage - 1} 面制覇！
次は『STAGE ${currentStage}』完全ランダム面へ突入！`;
  startBtn.textContent = `STAGE ${currentStage} へ`;
  overlay.style.display = 'flex';
}

function handleDeath() {
  if (player.invincibleTimer > 0) return;

  sfx.playHit();
  lives--;
  updateStats();

  player.trail.forEach(pt => { grid[pt.y * GW + pt.x] = EMPTY; });
  player.trail = [];
  player.vx = 0; player.vy = 0;
  player.nextVx = 0; player.nextVy = 0;

  if (lives <= 0) {
    isPlaying = false;
    ovTitle.textContent = 'GAME OVER';
    ovDesc.textContent = `到達ステージ: STAGE ${currentStage}
クリア面数: ${currentStage - 1} 面
もう一度チャレンジして新記録を目指そう！`;
    startBtn.textContent = 'STAGE 1 からリトライ';
    overlay.style.display = 'flex';
    currentStage = 1;
    lives = 3;
  } else {
    // 安全な最寄り自陣マスへ復帰
    let found = false;
    for (let r = 0; r < GW && !found; r++) {
      for (let dy = -r; dy <= r && !found; dy++) {
        for (let dx = -r; dx <= r && !found; dx++) {
          if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
          const nx = spawnPoint.x + dx;
          const ny = spawnPoint.y + dy;
          if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
            if (grid[ny * GW + nx] === CLAIMED) {
              player.gx = nx;
              player.gy = ny;
              player.inClaimed = true;
              found = true;
            }
          }
        }
      }
    }
    if (!found) {
      player.gx = spawnPoint.x;
      player.gy = spawnPoint.y;
      player.inClaimed = true;
    }
  }
}

function updatePlayer() {
  if (player.invincibleTimer > 0) player.invincibleTimer--;

  player.speedCounter++;
  if (player.speedCounter % player.speedDelay !== 0) return;

  if (player.nextVx !== 0 || player.nextVy !== 0) {
    player.vx = player.nextVx;
    player.vy = player.nextVy;
  }
  if (player.vx === 0 && player.vy === 0) return;

  const nx = player.gx + player.vx;
  const ny = player.gy + player.vy;

  if (nx < 0 || nx >= GW || ny < 0 || ny >= GH) {
    player.vx = 0; player.vy = 0;
    return;
  }

  const target = grid[ny * GW + nx];

  // 岩（ROCK）および自分のトレイル（TRAIL）は突き抜けない壁として停止
  if (target === ROCK || target === TRAIL) {
    player.vx = 0; player.vy = 0;
    player.nextVx = 0; player.nextVy = 0;
    return;
  }

  player.gx = nx;
  player.gy = ny;

  if (target === CLAIMED) {
    if (!player.inClaimed) {
      fillEnclosedArea();
      player.inClaimed = true;
    }
  } else if (target === EMPTY) {
    player.inClaimed = false;
    grid[ny * GW + nx] = TRAIL;
    player.trail.push({ x: nx, y: ny });
    sfx.playLine();
  }
}

function updateEnemies() {
  enemies.forEach(e => {
    if (e.vx === 0 && e.vy === 0) return;

    // 行動AI分岐
    if (e.type === 'SNAKE') {
      e.waveTimer = (e.waveTimer || 0) + 0.08;
      e.vy += Math.sin(e.waveTimer) * 0.12;
    } else if (e.type === 'HUNTER' && !player.inClaimed) {
      // プレイヤーが線を引いている時だけじわじわ追尾
      const targetRealX = player.gx * CELL_SIZE;
      const targetRealY = player.gy * CELL_SIZE;
      const angle = Math.atan2(targetRealY - e.y, targetRealX - e.x);
      e.vx += Math.cos(angle) * 0.06;
      e.vy += Math.sin(angle) * 0.06;
      const spd = Math.hypot(e.vx, e.vy);
      if (spd > 2.5) { e.vx = (e.vx / spd) * 2.5; e.vy = (e.vy / spd) * 2.5; }
    } else if (e.type === 'WARPER') {
      e.warpCooldown--;
      if (e.warpCooldown <= 0) {
        const wp = findSafeEnemySpawn(e.r);
        e.x = wp.x;
        e.y = wp.y;
        e.warpCooldown = 220 + Math.floor(Math.random() * 100);
      }
    }

    e.x += e.vx;
    e.y += e.vy;

    const gx = Math.floor(e.x / CELL_SIZE);
    const gy = Math.floor(e.y / CELL_SIZE);

    if (e.x - e.r < 0 || e.x + e.r >= GW * CELL_SIZE) e.vx *= -1;
    if (e.y - e.r < 0 || e.y + e.r >= GH * CELL_SIZE) e.vy *= -1;

    // 衝突＆反射判定
    const checkRadius = Math.ceil(e.r / CELL_SIZE);
    for (let dy = -checkRadius; dy <= checkRadius; dy++) {
      for (let dx = -checkRadius; dx <= checkRadius; dx++) {
        const cx = gx + dx;
        const cy = gy + dy;
        if (cx >= 0 && cx < GW && cy >= 0 && cy < GH) {
          const cell = grid[cy * GW + cx];
          const cellCenterX = cx * CELL_SIZE + CELL_SIZE / 2;
          const cellCenterY = cy * CELL_SIZE + CELL_SIZE / 2;
          const dist = Math.hypot(e.x - cellCenterX, e.y - cellCenterY);

          if ((cell === CLAIMED || cell === ROCK) && dist < e.r + CELL_SIZE / 2) {
            if (Math.abs(e.x - cellCenterX) > Math.abs(e.y - cellCenterY)) {
              e.vx *= -1;
              e.x += (e.vx > 0 ? 1 : -1) * 1.5;
            } else {
              e.vy *= -1;
              e.y += (e.vy > 0 ? 1 : -1) * 1.5;
            }
          }
          if (cell === TRAIL && dist < e.r + CELL_SIZE / 2) {
            handleDeath();
            return;
          }
        }
      }
    }

    // プレイヤー本体との接触
    const pRealX = player.gx * CELL_SIZE + CELL_SIZE / 2;
    const pRealY = player.gy * CELL_SIZE + CELL_SIZE / 2;
    if (!player.inClaimed && Math.hypot(e.x - pRealX, e.y - pRealY) < e.r + CELL_SIZE / 2) {
      handleDeath();
    }
  });
}

function draw() {
  ctx.fillStyle = stageTheme.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // マップ描画
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const c = grid[y * GW + x];
      if (c === CLAIMED) {
        ctx.fillStyle = ((x ^ y) % 5 === 0) ? stageTheme.landAccent : stageTheme.landBase;
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      } else if (c === TRAIL) {
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      } else if (c === ROCK) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#475569' : '#1e293b';
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        if ((x * 3 + y * 7) % 9 === 0) {
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(x * CELL_SIZE + 1, y * CELL_SIZE + 1, 2, 2);
        }
      }
    }
  }

  // アイテム描画
  items.forEach(it => {
    const ix = it.gx * CELL_SIZE + CELL_SIZE / 2;
    const iy = it.gy * CELL_SIZE + CELL_SIZE / 2;
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.icon, ix, iy);
  });

  // 敵描画
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI * 2);
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = e.color;
    ctx.fill();
    ctx.shadowBlur = 0;

    // 氷結エフェクト
    if (e.vx === 0 && e.vy === 0) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // 目
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-e.r * 0.35, -e.r * 0.15, e.r * 0.28, 0, Math.PI * 2);
    ctx.arc(e.r * 0.35, -e.r * 0.15, e.r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(-e.r * 0.3, -e.r * 0.15, e.r * 0.14, 0, Math.PI * 2);
    ctx.arc(e.r * 0.4, -e.r * 0.15, e.r * 0.14, 0, Math.PI * 2);
    ctx.fill();

    // ボスの王冠
    if (e.type === 'BOSS') {
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(-e.r * 0.6, -e.r * 0.8);
      ctx.lineTo(-e.r * 0.3, -e.r * 1.25);
      ctx.lineTo(0, -e.r * 0.8);
      ctx.lineTo(e.r * 0.3, -e.r * 1.25);
      ctx.lineTo(e.r * 0.6, -e.r * 0.8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  });

  // 自機描画
  const px = player.gx * CELL_SIZE;
  const py = player.gy * CELL_SIZE;
  ctx.fillStyle = player.invincibleTimer > 0 ? '#ec4899' : '#fde047';
  if (player.invincibleTimer > 0) {
    ctx.shadowBlur = 12; ctx.shadowColor = '#ec4899';
  } else {
    ctx.shadowBlur = 8; ctx.shadowColor = '#facc15';
  }
  ctx.fillRect(px - 1, py - 1, CELL_SIZE + 2, CELL_SIZE + 2);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(px + 1, py + 1, 2, 2);
}

function gameLoop() {
  if (isPlaying) {
    updatePlayer();
    updateEnemies();
    draw();
  }
  requestAnimationFrame(gameLoop);
}

function setDirection(x, y) {
  if (player.trail.length > 0) {
    if (x === -player.vx && y === 0) return;
    if (y === -player.vy && x === 0) return;
  }
  player.nextVx = x;
  player.nextVy = y;
}

// キーボード操作（PC用）
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) { setDirection(0, -1); e.preventDefault(); }
  if (['ArrowDown', 'KeyS'].includes(e.code)) { setDirection(0, 1); e.preventDefault(); }
  if (['ArrowLeft', 'KeyA'].includes(e.code)) { setDirection(-1, 0); e.preventDefault(); }
  if (['ArrowRight', 'KeyD'].includes(e.code)) { setDirection(1, 0); e.preventDefault(); }
});

// iPhone 15 親指スワイプ操作最適化
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  sfx.init();
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (!touchStartX || !touchStartY) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  // 14pxの微小移動でクイックに認識
  if (Math.hypot(dx, dy) > 14) {
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
    else setDirection(0, dy > 0 ? 1 : -1);
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

startBtn.addEventListener('click', () => {
  sfx.init();
  overlay.style.display = 'none';
  initStage(currentStage);
  isPlaying = true;
});

initStage(1);
draw();
requestAnimationFrame(gameLoop);
</script>

</body>
