<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Qix Island - 陣取りゲーム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background-color: #0b0f19;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 10px;
    touch-action: none;
    overflow: hidden;
  }
  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #1e293b;
    border-radius: 8px;
    margin-bottom: 8px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  }
  .stat-box { display: flex; flex-direction: column; align-items: center; }
  .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-val { font-size: 18px; font-weight: bold; color: #38bdf8; }
  .stat-target { font-size: 11px; color: #f59e0b; }
  
  #canvas-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
    background: #020617;
    border: 3px solid #334155;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 15, 25, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  #overlay h2 { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
  #overlay p { font-size: 14px; color: #cbd5e1; margin-bottom: 18px; line-height: 1.5; }
  .btn {
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 12px 32px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.96); }

  /* D-PAD */
  #controls {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 50px);
    gap: 6px;
    margin-top: 12px;
  }
  .d-btn {
    background: #1e293b;
    border: 2px solid #475569;
    border-radius: 10px;
    color: #e2e8f0;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .d-btn:active, .d-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
  #d-up { grid-column: 2; grid-row: 1; }
  #d-left { grid-column: 1; grid-row: 2; }
  #d-right { grid-column: 3; grid-row: 2; }
  #d-down { grid-column: 2; grid-row: 3; }
  
  .hint-text {
    font-size: 11px;
    color: #64748b;
    margin-top: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="stat-box">
    <span class="stat-label">ステージ</span>
    <span class="stat-val" id="stage-disp">1 / 5</span>
  </div>
  <div class="stat-box">
    <span class="stat-label">領土 (目標 75%)</span>
    <span class="stat-val" id="area-disp">0%</span>
  </div>
  <div class="stat-box">
    <span class="stat-label">ライフ</span>
    <span class="stat-val" id="life-disp" style="color: #f43f5e;">❤❤❤</span>
  </div>
</header>

<div id="canvas-container">
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="ov-title">QIX ISLAND</h2>
    <p id="ov-desc">安全地帯から飛び出し、未開拓エリアを囲んで戻ると陣地を切り取れます！敵に引いた線を触られないように注意！</p>
    <button class="btn" id="start-btn">スタート</button>
  </div>
</div>

<div id="controls">
  <button class="d-btn" id="d-up">▲</button>
  <button class="d-btn" id="d-left">◀</button>
  <button class="d-btn" id="d-right">▶</button>
  <button class="d-btn" id="d-down">▼</button>
</div>
<div class="hint-text">キーボードの矢印キー / WASD / スワイプでも操作可能</div>

<script>
// Web Audio 簡易シンセ
class SoundEffect {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playLine() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.05);
    g.gain.setValueAtTime(0.04, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.05);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.05);
  }
  playCut() {
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.04);
      g.gain.setValueAtTime(0.08, this.ctx.currentTime + idx * 0.04);
      g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + idx * 0.04 + 0.15);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.04);
      osc.stop(this.ctx.currentTime + idx * 0.04 + 0.15);
    });
  }
  playHit() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  }
  playClear() {
    if (!this.ctx) return;
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
      g.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.08);
      g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + idx * 0.08 + 0.25);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.08);
      osc.stop(this.ctx.currentTime + idx * 0.08 + 0.25);
    });
  }
}

const sfx = new SoundEffect();

// 定数 & グリッド設定
const GW = 80;
const GH = 80;
const CELL_SIZE = 5; // 80 * 5 = 400px

const EMPTY = 0;   // 未開拓（敵が動き回るゾーン）
const CLAIMED = 1; // プレイヤーの安全地帯（領土）
const TRAIL = 2;   // 引いている途中の線

let grid = new Uint8Array(GW * GH);
let currentStage = 1;
const MAX_STAGE = 5;
let lives = 3;
let isPlaying = false;
let currentAreaPercent = 0;

// プレイヤー
let player = {
  gx: 0,
  gy: 0,
  vx: 0,
  vy: 0,
  nextVx: 0,
  nextVy: 0,
  inClaimed: true,
  trail: []
};

// 敵
let enemies = [];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovDesc = document.getElementById('ov-desc');
const startBtn = document.getElementById('start-btn');
const areaDisp = document.getElementById('area-disp');
const stageDisp = document.getElementById('stage-disp');
const lifeDisp = document.getElementById('life-disp');

// ステージ初期化
function initStage(stage) {
  grid.fill(EMPTY);

  if (stage === 1) {
    // ステージ1: 外周枠 (Classic Qix)
    for (let x = 0; x < GW; x++) {
      for (let y = 0; y < GH; y++) {
        if (x < 3 || x >= GW - 3 || y < 3 || y >= GH - 3) {
          grid[y * GW + x] = CLAIMED;
        }
      }
    }
    player.gx = 3; player.gy = 3;
    enemies = [
      { x: 40 * CELL_SIZE, y: 40 * CELL_SIZE, vx: 2.2, vy: 1.8, r: 10, color: '#f43f5e' }
    ];
  } 
  else if (stage === 2) {
    // ステージ2: センター孤島スタート
    const cx = GW / 2, cy = GH / 2;
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        const dist = Math.hypot(x - cx, y - cy);
        if (dist <= 12) {
          grid[y * GW + x] = CLAIMED;
        }
      }
    }
    player.gx = Math.floor(cx); player.gy = Math.floor(cy);
    enemies = [
      { x: 15 * CELL_SIZE, y: 15 * CELL_SIZE, vx: 2.5, vy: 1.5, r: 10, color: '#f43f5e' },
      { x: 65 * CELL_SIZE, y: 65 * CELL_SIZE, vx: -1.8, vy: 2.2, r: 10, color: '#ec4899' }
    ];
  }
  else if (stage === 3) {
    // ステージ3: 日本地図シルエット (北海道・本州・九州)
    const drawIsland = (cx, cy, rx, ry, rot) => {
      const cos = Math.cos(rot), sin = Math.sin(rot);
      for (let y = 0; y < GH; y++) {
        for (let x = 0; x < GW; x++) {
          const dx = x - cx, dy = y - cy;
          const nx = cos * dx - sin * dy;
          const ny = sin * dx + cos * dy;
          if ((nx*nx)/(rx*rx) + (ny*ny)/(ry*ry) <= 1) {
            grid[y * GW + x] = CLAIMED;
          }
        }
      }
    };
    drawIsland(60, 20, 9, 7, 0.2);          // 北海道
    drawIsland(40, 42, 22, 6, -0.6);        // 本州
    drawIsland(22, 64, 8, 6, -0.2);         // 九州・四国
    player.gx = 40; player.gy = 42;
    enemies = [
      { x: 15 * CELL_SIZE, y: 25 * CELL_SIZE, vx: 2.2, vy: -2.0, r: 9, color: '#f59e0b' },
      { x: 65 * CELL_SIZE, y: 60 * CELL_SIZE, vx: -2.0, vy: 2.4, r: 9, color: '#f43f5e' }
    ];
  }
  else if (stage === 4) {
    // ステージ4: 世界地図・多島海 (ユーラシア、アフリカ、南北アメリカ)
    const drawBox = (x1, y1, w, h) => {
      for (let y = y1; y < y1 + h; y++) {
        for (let x = x1; x < x1 + w; x++) {
          if (x >= 0 && x < GW && y >= 0 && y < GH) grid[y * GW + x] = CLAIMED;
        }
      }
    };
    drawBox(12, 16, 16, 18); // 北米
    drawBox(18, 42, 14, 22); // 南米
    drawBox(44, 14, 26, 22); // ユーラシア
    drawBox(46, 42, 16, 20); // アフリカ
    drawBox(66, 52, 10, 10); // オセアニア
    player.gx = 50; player.gy = 20;
    enemies = [
      { x: 34 * CELL_SIZE, y: 30 * CELL_SIZE, vx: 2.5, vy: 2.0, r: 8, color: '#38bdf8' },
      { x: 34 * CELL_SIZE, y: 60 * CELL_SIZE, vx: -2.0, vy: -2.5, r: 8, color: '#ec4899' },
      { x: 70 * CELL_SIZE, y: 30 * CELL_SIZE, vx: 2.2, vy: -2.2, r: 8, color: '#eab308' }
    ];
  }
  else if (stage === 5) {
    // ステージ5: 二重同心円の要塞
    const cx = GW / 2, cy = GH / 2;
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        const d = Math.hypot(x - cx, y - cy);
        if (d <= 7 || (d >= 24 && d <= 30)) {
          grid[y * GW + x] = CLAIMED;
        }
      }
    }
    player.gx = Math.floor(cx); player.gy = Math.floor(cy);
    enemies = [
      { x: 30 * CELL_SIZE, y: 22 * CELL_SIZE, vx: 3.0, vy: 2.5, r: 8, color: '#f43f5e' },
      { x: 50 * CELL_SIZE, y: 58 * CELL_SIZE, vx: -2.8, vy: -3.0, r: 8, color: '#a855f7' },
      { x: 12 * CELL_SIZE, y: 12 * CELL_SIZE, vx: 3.2, vy: -2.0, r: 8, color: '#f97316' }
    ];
  }

  player.vx = 0;
  player.vy = 0;
  player.nextVx = 0;
  player.nextVy = 0;
  player.inClaimed = true;
  player.trail = [];
  updateStats();
}

function updateStats() {
  let claimedCount = 0;
  for (let i = 0; i < GW * GH; i++) {
    if (grid[i] === CLAIMED) claimedCount++;
  }
  currentAreaPercent = Math.floor((claimedCount / (GW * GH)) * 100);
  areaDisp.textContent = `${currentAreaPercent}%`;
  stageDisp.textContent = `${currentStage} / ${MAX_STAGE}`;
  lifeDisp.textContent = '❤'.repeat(lives);
}

// 塗りつぶし (Flood Fill によるエリア判定)
function fillEnclosedArea() {
  const visited = new Uint8Array(GW * GH);
  const queue = [];

  // 各敵のいる地点から未開拓セル(EMPTY)を到達可能探索
  enemies.forEach(e => {
    const egx = Math.max(0, Math.min(GW - 1, Math.floor(e.x / CELL_SIZE)));
    const egy = Math.max(0, Math.min(GH - 1, Math.floor(e.y / CELL_SIZE)));
    const idx = egy * GW + egx;
    if (grid[idx] !== CLAIMED && visited[idx] === 0) {
      visited[idx] = 1;
      queue.push(egx, egy);
    }
  });

  // 万一敵がCLAIMEDに入り込んでいた場合の全敵探索フォールバック
  let head = 0;
  while(head < queue.length) {
    const qx = queue[head++];
    const qy = queue[head++];

    const dirs = [ [1,0], [-1,0], [0,1], [0,-1] ];
    for (let i = 0; i < 4; i++) {
      const nx = qx + dirs[i][0];
      const ny = qy + dirs[i][1];
      if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
        const nIdx = ny * GW + nx;
        // CLAIMEDでもTRAILでもなく、未到達のセル
        if (grid[nIdx] !== CLAIMED && grid[nIdx] !== TRAIL && visited[nIdx] === 0) {
          visited[nIdx] = 1;
          queue.push(nx, ny);
        }
      }
    }
  }

  // TRAILをCLAIMEDに変換
  player.trail.forEach(pt => {
    grid[pt.y * GW + pt.x] = CLAIMED;
  });
  player.trail = [];

  // 敵の到達しなかった全EMPTYセルをCLAIMEDとして占領！
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = y * GW + x;
      if (grid[idx] === EMPTY && visited[idx] === 0) {
        grid[idx] = CLAIMED;
      }
    }
  }

  sfx.playCut();
  updateStats();

  if (currentAreaPercent >= 75) {
    handleStageClear();
  }
}

function handleStageClear() {
  isPlaying = false;
  sfx.playClear();
  if (currentStage < MAX_STAGE) {
    ovTitle.textContent = `ステージ ${currentStage} クリア！`;
    ovDesc.textContent = `占有率 ${currentAreaPercent}% 達成！次は新しいエリアギミックです。`;
    startBtn.textContent = '次のステージへ';
    overlay.style.display = 'flex';
    currentStage++;
  } else {
    ovTitle.textContent = '全ステージ制覇！おめでとう！';
    ovDesc.textContent = `素晴らしい探検力です！すべての領土を取り戻しました！`;
    startBtn.textContent = '最初からもう一度遊ぶ';
    overlay.style.display = 'flex';
    currentStage = 1;
    lives = 3;
  }
}

function handleDeath() {
  sfx.playHit();
  lives--;
  updateStats();

  // 引いていた線を消去
  player.trail.forEach(pt => {
    grid[pt.y * GW + pt.x] = EMPTY;
  });
  player.trail = [];
  player.vx = 0; player.vy = 0;
  player.nextVx = 0; player.nextVy = 0;

  if (lives <= 0) {
    isPlaying = false;
    ovTitle.textContent = 'ゲームオーバー';
    ovDesc.textContent = `敵に線を捕まってしまいました。もう一度挑戦してみよう！`;
    startBtn.textContent = 'リトライ';
    overlay.style.display = 'flex';
    lives = 3;
  } else {
    // 直前の安全なCLAIMED位置へ戻る
    let found = false;
    for (let r = 0; r < GW && !found; r++) {
      for (let dy = -r; dy <= r && !found; dy++) {
        for (let dx = -r; dx <= r && !found; dx++) {
          const nx = player.gx + dx;
          const ny = player.gy + dy;
          if (nx >= 0 && nx < GW && ny >= 0 && ny < GH) {
            if (grid[ny * GW + nx] === CLAIMED) {
              player.gx = nx;
              player.gy = ny;
              player.inClaimed = true;
              found = true;
            }
          }
        }
      }
    }
  }
}

// プレイヤー更新
let moveStepCounter = 0;
function updatePlayer() {
  moveStepCounter++;
  // プレイヤー移動速度調整（3フレームに1セル）
  if (moveStepCounter % 3 !== 0) return;

  if (player.nextVx !== 0 || player.nextVy !== 0) {
    player.vx = player.nextVx;
    player.vy = player.nextVy;
  }

  if (player.vx === 0 && player.vy === 0) return;

  const nextX = player.gx + player.vx;
  const nextY = player.gy + player.vy;

  if (nextX < 0 || nextX >= GW || nextY < 0 || nextY >= GH) {
    player.vx = 0; player.vy = 0;
    return;
  }

  const targetCell = grid[nextY * GW + nextX];

  // 自分の引いている線にぶつかったら自爆
  if (targetCell === TRAIL) {
    handleDeath();
    return;
  }

  player.gx = nextX;
  player.gy = nextY;

  if (targetCell === CLAIMED) {
    if (!player.inClaimed) {
      // 危険ゾーンから安全ゾーンへ帰還 ＝ エリア囲い込み完了！
      fillEnclosedArea();
      player.inClaimed = true;
    }
  } else if (targetCell === EMPTY) {
    // 危険ゾーンへ踏み出し
    player.inClaimed = false;
    grid[nextY * GW + nextX] = TRAIL;
    player.trail.push({ x: nextX, y: nextY });
    sfx.playLine();
  }
}

// 敵の移動 & 衝突判定
function updateEnemies() {
  enemies.forEach(e => {
    e.x += e.vx;
    e.y += e.vy;

    // グリッド座標
    const gx = Math.floor(e.x / CELL_SIZE);
    const gy = Math.floor(e.y / CELL_SIZE);

    // 壁バウンド (CLAIMED or 画面端)
    if (e.x - e.r < 0 || e.x + e.r >= GW * CELL_SIZE) e.vx *= -1;
    if (e.y - e.r < 0 || e.y + e.r >= GH * CELL_SIZE) e.vy *= -1;

    // 周囲8方向チェックでCLAIMEDブロックとの反射
    const checkRadius = Math.ceil(e.r / CELL_SIZE);
    for (let dy = -checkRadius; dy <= checkRadius; dy++) {
      for (let dx = -checkRadius; dx <= checkRadius; dx++) {
        const cx = gx + dx;
        const cy = gy + dy;
        if (cx >= 0 && cx < GW && cy >= 0 && cy < GH) {
          const cell = grid[cy * GW + cx];
          const cellCenterX = cx * CELL_SIZE + CELL_SIZE / 2;
          const cellCenterY = cy * CELL_SIZE + CELL_SIZE / 2;
          const dist = Math.hypot(e.x - cellCenterX, e.y - cellCenterY);

          if (cell === CLAIMED && dist < e.r + CELL_SIZE / 2) {
            // 反射
            if (Math.abs(e.x - cellCenterX) > Math.abs(e.y - cellCenterY)) {
              e.vx *= -1;
              e.x += e.vx * 1.5;
            } else {
              e.vy *= -1;
              e.y += e.vy * 1.5;
            }
          }
          // 敵がトレイル(引いている線)に触れたら即アウト
          if (cell === TRAIL && dist < e.r + CELL_SIZE / 2) {
            handleDeath();
            return;
          }
        }
      }
    }

    // プレイヤー本体との接触判定
    const pRealX = player.gx * CELL_SIZE + CELL_SIZE / 2;
    const pRealY = player.gy * CELL_SIZE + CELL_SIZE / 2;
    if (!player.inClaimed && Math.hypot(e.x - pRealX, e.y - pRealY) < e.r + CELL_SIZE / 2) {
      handleDeath();
    }
  });
}

// 描画ループ
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. グリッド描画
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const c = grid[y * GW + x];
      if (c === CLAIMED) {
        ctx.fillStyle = '#0284c7'; // 陣地ブルー
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      } else if (c === TRAIL) {
        ctx.fillStyle = '#22c55e'; // ネオングリーン線
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
    }
  }

  // 領土の境界線を淡く光らせるグリッドテクスチャ
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
  ctx.lineWidth = 0.5;

  // 2. 敵の描画
  enemies.forEach(e => {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = e.color;
    ctx.fill();
    ctx.shadowBlur = 0;
    // トゲトゲ飾り
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // 3. プレイヤー描画
  const px = player.gx * CELL_SIZE;
  const py = player.gy * CELL_SIZE;
  ctx.fillStyle = '#facc15'; // 鮮やかなイエロー
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#facc15';
  ctx.fillRect(px - 1, py - 1, CELL_SIZE + 2, CELL_SIZE + 2);
  ctx.shadowBlur = 0;

  // 目印（プレイヤーの顔）
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(px + 1, py + 1, 2, 2);
}

function gameLoop() {
  if (isPlaying) {
    updatePlayer();
    updateEnemies();
    draw();
  }
  requestAnimationFrame(gameLoop);
}

// 入力イベント
function setDirection(x, y) {
  // 逆方向への即反転を防止
  if (player.trail.length > 0) {
    if (x === -player.vx && y === 0) return;
    if (y === -player.vy && x === 0) return;
  }
  player.nextVx = x;
  player.nextVy = y;
}

window.addEventListener('keydown', e => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) { setDirection(0, -1); e.preventDefault(); }
  if (['ArrowDown', 'KeyS'].includes(e.code)) { setDirection(0, 1); e.preventDefault(); }
  if (['ArrowLeft', 'KeyA'].includes(e.code)) { setDirection(-1, 0); e.preventDefault(); }
  if (['ArrowRight', 'KeyD'].includes(e.code)) { setDirection(1, 0); e.preventDefault(); }
});

const bindBtn = (id, x, y) => {
  const el = document.getElementById(id);
  const trigger = (e) => {
    e.preventDefault();
    sfx.init();
    setDirection(x, y);
    el.classList.add('active');
  };
  const release = () => el.classList.remove('active');
  el.addEventListener('touchstart', trigger, { passive: false });
  el.addEventListener('touchend', release);
  el.addEventListener('mousedown', trigger);
  el.addEventListener('mouseup', release);
};

bindBtn('d-up', 0, -1);
bindBtn('d-down', 0, 1);
bindBtn('d-left', -1, 0);
bindBtn('d-right', 1, 0);

// スワイプ操作対応
let touchStartX = 0;
let touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  sfx.init();
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (!touchStartX || !touchStartY) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (Math.hypot(dx, dy) > 20) {
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

startBtn.addEventListener('click', () => {
  sfx.init();
  overlay.style.display = 'none';
  initStage(currentStage);
  isPlaying = true;
});

// 初期描画
initStage(1);
draw();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
